services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:1b}"
      OLLAMA_TIMEOUT_S: "${OLLAMA_TIMEOUT_S:-120}"
    depends_on:
      - ollama
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
  ollama:
    image: ${OLLAMA_IMAGE:-slawekradzyminski/llama3.2:1b}
    ports:
      - "11434:11434"
    volumes:
      - ollama-llama:/root/.ollama
      - ./docker/ollama-entrypoint.sh:/usr/local/bin/ollama-entrypoint.sh:ro
    environment:
      OLLAMA_MODEL: "${OLLAMA_MODEL:-llama3.2:1b}"
    entrypoint: ["/usr/local/bin/ollama-entrypoint.sh"]

volumes:
  ollama-llama:
