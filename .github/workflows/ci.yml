name: CI

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install backend dependencies
        working-directory: backend
        run: poetry -C .. install --no-interaction --no-ansi
      - name: Ruff
        working-directory: backend
        run: poetry -C .. run ruff check backend/
      - name: Pytest
        working-directory: backend
        run: poetry -C .. run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify docker compose stack
        run: bash scripts/verify_docker_compose.sh
