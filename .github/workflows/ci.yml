name: CI

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install backend dependencies
        working-directory: backend
        run: poetry -C .. install --no-interaction --no-ansi
      - name: Check (lint + types + tests)
        run: poetry run check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check (lint + build + tests)
        working-directory: frontend
        run: npm run check

  docker-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify docker compose stack
        run: bash scripts/verify_docker_compose.sh
