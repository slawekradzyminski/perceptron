[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "perceptron-visual-lab"
version = "0.1.0"
description = "Perceptron visual lab backend"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "backend" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = "^0.128.0"
uvicorn = "^0.40.0"
python-multipart = "^0.0.20"
torch = ">=2.6"
torchvision = ">=0.21"
pillow = "^10.0"
tiktoken = "^0.8"
transformers = "^4.40"
accelerate = "^1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
httpx = "^0.28.1"
pytest-cov = "^7.0.0"
ruff = "^0.14.10"
mypy = "^1.19.1"

[tool.poetry.scripts]
perceptron-api = "backend.api_app:run"
perceptron-runner = "backend.runner:main"
check = "backend.scripts.check:main"

[tool.pytest.ini_options]
addopts = "-q --cov=backend --cov-report=term-missing:skip-covered --cov-report=xml"
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["backend"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]
# Ignore missing stubs for third-party libraries
ignore_missing_imports = true
# Don't require explicit types everywhere - infer from constants/literals
disallow_untyped_defs = false
# But do check types when they are provided
check_untyped_defs = true

[[tool.mypy.overrides]]
# Ignore test files entirely
module = "backend.tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Stricter checking for schemas (our new typed code)
module = "backend.schemas.*"
disallow_untyped_defs = true
warn_return_any = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (needed for FastAPI Depends)
    "B905",   # zip() without explicit strict= parameter
    "ARG001", # unused function argument (common in route handlers)
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
